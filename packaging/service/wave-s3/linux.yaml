# The `wave-s3` service graph: `http` hands every request to `s3_serve`, which
# stores through the graph's own `store`: a durable log in `store_dir`, every
# operation under a grant verified against the mesh roots.
target: linux
tick_us: 100

# The package's params: `fluxor run wave-s3 --param <name>=<value>`.
params:
  port:
    type: integer
    default: 9000
    min: 1
    max: 65535
    description: TCP port the S3 endpoint listens on
  credentials:
    type: string
    required: true
    example: /etc/wave-s3/credentials
    description: "Path of the credentials file: access key, secret, scope and capability per line"
  mesh_roots:
    type: string
    required: true
    example: 3b6a27bcceb6a42d62a3a8d02a6f0d73653215771de243a63ac048a18b59da29
    description: The mesh root (or two, comma-separated) the credentials' capabilities verify against
  store_dir:
    type: string
    required: true
    example: /var/lib/wave-s3
    description: Directory the object store keeps its log in (at most 96 bytes)
  store_bytes:
    type: integer
    default: 268435456
    min: 65536
    max: 4294967295
    description: Memory the object store holds every object's bytes in, and the most one upload may stage; bytes
  region:
    type: string
    default: us-east-1
    description: Region requests must be signed for
  max_object_mib:
    type: integer
    default: 256
    min: 1
    max: 5242880
    description: Largest object accepted, MiB
  part_min_kib:
    type: integer
    default: 5120
    min: 0
    max: 5242880
    description: Smallest multipart part but the last, KiB

# `linux_net` and `http` feed each other, and `http` and `s3_serve` feed each
# other: a request/response pair is a cycle by construction.
scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  - name: http
    port: ${param:port}
    # The kernel owns TCP segmentation.
    host_tcp: 1
    # The body ceiling of the S3 route: the largest the route accepts (1 TiB,
    # in KiB). Bodies stream to `s3_serve` on credit and are never held whole;
    # the object-size ceiling a request meets is `s3_serve`'s.
    route_0_max_body_kib: 1073741824
    routes:
      # A bare `/` is a prefix for an application route: every bucket and key
      # reaches `s3_serve` with its full target.
      - path: "/"
        app: true

  # The object store: a durable log in `store_dir`, every object's bytes held
  # in memory, every operation under a grant `s3_serve` presents and the store
  # verifies against the same mesh roots. Each of `s3_serve`'s 32 exchanges
  # may hold a read or a streamed write at once.
  - name: store
    dir: ${param:store_dir}
    durable: on
    roots: ${param:mesh_roots}
    objects: 4096
    value_bytes: ${param:store_bytes}
    stage_max: ${param:store_bytes}
    reads: 32
    writes: 32

  - name: s3_serve
    credentials: ${param:credentials}
    mesh_roots: ${param:mesh_roots}
    region: ${param:region}
    max_object_mib: ${param:max_object_mib}
    part_min_kib: ${param:part_min_kib}

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in
  # The exchange: `http` asks, `s3_serve` answers.
  - from: http.request_out
    to: s3_serve.request_in
  - from: s3_serve.response_out
    to: http.response_in
