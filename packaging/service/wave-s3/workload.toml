# An S3 server: `http` terminating the protocol, `s3_serve` answering it, and
# objects kept by the package's own `store` under the mesh capability each
# access key is bound to. Its params are the graph's (linux.yaml).
#
#   fluxor publish                               # in this project
#   # in the consumer: [dependencies] wave = "…", [uses] packages = ["wave-s3"]
#   fluxor update && fluxor sync
#   fluxor run wave-s3 --param credentials=/etc/s3/credentials \
#     --param mesh_roots=<root> --param store_dir=/var/lib/wave-s3
#
# The store verifies every grant against the same `mesh_roots` the
# credentials are checked against: `s3_serve` refuses to serve through a store
# that keeps no authority.
[workload]
name = "wave-s3"
version = "0.1.0"
role = "service"

[[implementation]]
target = "linux"
graph = "linux.yaml"
