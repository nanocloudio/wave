version = "1.1.0"
hardware_targets = ["rp2350", "bcm2712"]

# timer_class: this module reads no clock at all — verified, it calls neither
# `dev_millis` nor `dev_micros`. Transmit is DATA-driven: each access unit on
# `audio_in` / `video_in` becomes its packets as it arrives, stamped with the
# unit's own `pts`. Receive is packet-driven. Output is therefore a function of
# input, not of when the module runs, which is exactly `agnostic`. The
# real-time pacing of the stream belongs to whoever feeds the media input and
# to the receiver's playout — not here.
# NOTE this is an EXPLICIT attestation, not the absent-field default: absent
# means "assume step-counted" and blocks admission to a variable-cadence
# domain. If a future revision ever paces
# transmission itself, this must be revisited before it is `agnostic` again.
timer_class = "agnostic"

[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"

# Media to send (in[1] or in[2] — one, never both: one instance is one RTP
# stream). The fluxor encoded-media record stream; its STREAM record must name
# the negotiated `codec` at that payload format's RTP clock. Fragments up to
# `max_payload`; a larger access unit arrives as several.
[[ports]]
name = "audio_in"
index = 1
direction = "input"
content_type = "AudioEncoded"

[ports.facts]
codec = ["pcmu", "pcma", "opus"]
packing = "raw"
max_payload = 4096

[[ports]]
name = "video_in"
index = 2
direction = "input"
content_type = "VideoEncoded"

[ports.facts]
codec = ["h264", "vp8"]
packing = ["raw", "annexb", "length_prefixed"]
clock_rate = 90000
max_payload = 4096

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"

# Validated receive records (out[1]): metadata-bearing `[seq,timestamp,ssrc,PT,
# marker,codec][payload…]`, with a MID extension variant when RFC 8285 supplies
# one (layout: modules/common/rtp_wire.rs). The `jitter` adapter reorders and
# depacketizes them into the encoded-media record stream.
[[ports]]
name = "packets"
index = 1
direction = "output"
content_type = "OctetStream"

# RTCP statistics (out[2]): tagged records for a module building RFC 3550
# reports — one RX record per accepted packet, and a TX record carrying the
# transmit counters after each packet sent. APPENDED, so out[0] and out[1] keep
# their indices and every existing graph rewires nothing.
#
# No wall-clock time in either: this module reads no clock (see `timer_class`
# above) and the consumer stamps time from its own. What that costs each record
# is worked through in modules/common/rtp_wire.rs, which owns the layout.
#
# Best-effort. A record the channel cannot take is dropped and counted rather
# than retried: media must not stall because a report consumer fell behind, and
# a TX record is a latest-value that the next packet supersedes anyway.
[[ports]]
name = "rtcp_stats"
index = 2
direction = "output"
content_type = "OctetStream"
buffer_size = 1024
max_record = 13

[[ports]]
name = "endpoint"
direction = "ctrl_input"
content_type = "OctetStream"

[[resources]]
requires_contract = "channel"
access = "read"

# Module-scope observability — exempt (see ../standards/observability.md §6).
[observability]
exempt = "application-layer demo — byte throughput is observed at the foundation transport (ip/quic/http) it rides"
