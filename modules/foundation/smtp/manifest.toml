version          = "0.1.0"
hardware_targets = ["bcm2712"]

# timer_class: the two delivery deadlines (CONNECT_TIMEOUT_MS 10 s,
# REPLY_TIMEOUT_MS 15 s) are read from wall-clock `dev_millis`. A lockstep
# conversation waiting on a server-chosen reply has no tick-counted state at
# all, so a variable cadence cannot warp it.
timer_class      = "wall_clock"

# Transport to the SMTP server (net_proto): net_in reads NET_MSG_* events from
# linux_net/ip, net_out writes NET_CMD_CONNECT_TO/SEND/CLOSE.
[[ports]]
name         = "net_in"
direction    = "input"
content_type = "OctetStream"

[[ports]]
name         = "net_out"
direction    = "output"
content_type = "OctetStream"

# Status line (out[1]): a short human-readable line describing how the current
# submission ended. Enough for a statically configured graph; `response_out` is
# the surface a connector consumes, because a line of prose cannot carry the
# reply code, the enhanced status or the phase reached.
[[ports]]
name         = "status_out"
index        = 1
direction    = "output"
content_type = "OctetStream"

# Submissions (in[1]): exchange request records — the module is a PROVIDER of
# the exchange contract. A HEAD with method POST, `target` the one recipient,
# a `mail-from` header naming the envelope sender, and the message (headers
# and body) as its body, inline and in BODY records under the credit this
# module grants.
[[ports]]
name         = "request_in"
index        = 1
direction    = "input"
content_type = "ExchangeRequest"
max_record   = 8192
buffer_size  = 16384

# Answers (out[2]): exactly one per submission, under the requester's exchange
# id. The body is an `SmtpResult` (modules/common/smtp_wire.rs): the outcome
# classification a retry policy needs, the SMTP phase reached, the final reply
# code with its enhanced status and bounded text, and the peer address the
# message was submitted to. Status 200 when the relay gave its verdict, 502
# when it could not be reached or dropped the connection, 504 when it stopped
# answering; 400 / 413 / 503 for a request this module refuses itself.
[[ports]]
name         = "response_out"
index        = 2
direction    = "output"
content_type = "ExchangeResponse"
max_record   = 8192
buffer_size  = 4096

[observability]
exempt = "outbound mail-submission connector — throughput is the transport's (net) concern; this module runs one lockstep delivery conversation at a time"
