version          = "0.1.0"
hardware_targets = ["bcm2712"]

# timer_class: the two delivery deadlines (CONNECT_TIMEOUT_MS 10 s,
# REPLY_TIMEOUT_MS 15 s) are read from wall-clock `dev_millis`. A lockstep
# conversation waiting on a server-chosen reply has no tick-counted state at
# all, so a variable cadence cannot warp it (RFC adaptive_tick §8 rule 2).
timer_class      = "wall_clock"

# Transport to the SMTP server (net_proto): net_in reads NET_MSG_* events from
# linux_net/ip, net_out writes NET_CMD_CONNECT/SEND/CLOSE.
[[ports]]
name         = "net_in"
direction    = "input"
content_type = "OctetStream"

[[ports]]
name         = "net_out"
direction    = "output"
content_type = "OctetStream"

# Delivery result (out[1]): a short human-readable status line — "smtp: delivered"
# once the server accepts the message (250 to end-of-data, 221 to QUIT), or a
# rejection/timeout/network-error line otherwise.
[[ports]]
name         = "status_out"
index        = 1
direction    = "output"
content_type = "OctetStream"

[observability]
exempt = "outbound mail-submission connector — throughput is the transport's (net) concern; this module runs one lockstep delivery conversation"

