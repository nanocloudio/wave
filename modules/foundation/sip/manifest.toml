version = "1.0.1"
hardware_targets = ["rp2350", "bcm2712"]

# timer_class: the RFC 3261 T1 retransmit timer (500 ms, in-transaction
# states) reads wall-clock `dev_millis`. Playout's clock moved to the `jitter`
# module with the playout. Declaring the class is what lets the validator
# know: an absent attestation means "assume step-counted" and blocks
# admission to a variable-cadence domain.
timer_class = "wall_clock"

# SIP voice-signalling user-agent — signalling ONLY. One
# datagram endpoint (SIP, in[0]/out[0]); the media path is the separate `rtp`
# and `jitter` modules, driven over the control records on out[1]. Logic is
# the tested modules/common sip_core/sip_dialog; this is the wrapper.

[[ports]]
name = "sip_net_in"
index = 0
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "sip_net_out"
index = 0
direction = "output"
content_type = "OctetStream"
buffer_size = 640

# Media control (out[1]): SET_ENDPOINT/START/STOP records, fanned by the graph
# to `rtp.endpoint` and `jitter.media_ctrl`.
[[ports]]
name = "rtp_ctrl"
index = 1
direction = "output"
content_type = "OctetStream"

# Application commands (in[1]): `SipCommand` records — see
# modules/common/sip_wire.rs. Dial, accept, reject, hang up or cancel one call,
# with the peer and media endpoints travelling with the command rather than
# being fixed when the module was built.
#
# When this port is wired, `auto_answer` does not apply: a graph that wired a
# decision port and also let the module answer on its own would answer twice,
# and the first answer would be the one nobody authorised.
[[ports]]
name = "command_in"
index = 1
direction = "input"
content_type = "OctetStream"
buffer_size = 1024

# Call events (out[2]): `SipEvent` records. An offered call, the provisional
# responses to one placed, establishment with the negotiated media endpoint,
# and exactly one terminal outcome — rejected, timed out, failed, hung up by
# the peer, or closed locally.
[[ports]]
name = "event_out"
index = 2
direction = "output"
content_type = "OctetStream"
buffer_size = 2048

[[ports]]
name = "call"
direction = "ctrl_input"
content_type = "FmpMessage"

[[resources]]
requires_contract = "channel"
access = "read"

[observability]
exempt = "signalling module — media throughput is observed at the rtp transport"

