version          = "0.1.0"
hardware_targets = ["bcm2712"]
timer_class      = "wall_clock"

[[ports]]
name         = "net_in"
direction    = "input"
content_type = "NetProto"
buffer_size  = 2048

[[ports]]
name         = "net_out"
direction    = "output"
content_type = "NetProto"
buffer_size  = 2048
max_record   = 1600

[[ports]]
name         = "status_out"
index        = 1
direction    = "output"
content_type = "TextPlain"
buffer_size  = 2048

# Driven mode: one exchange at a time in the HTTP application records of
# modules/common/http_app.rs — the same records `http` speaks to its
# applications, from the client side. A caller writes REQUEST-direction
# records here: HEAD (method, `/bucket/key[?query]`, extra header lines,
# response credit), BODY (MORE until the last), CREDIT (more response credit)
# and ABORT. A body needs a `content-length` header (411 without one).
#
# Mailbox channels: wire both edges with a `buffer_group`, one per direction,
# so a write is one whole record and a read takes one whole record. A
# byte-streaming FIFO would fragment them.
#
# Both ports unwired = the boot ListBuckets probe.
[[ports]]
name         = "request_in"
index        = 1
direction    = "input"
content_type = "HttpRequest"
max_record   = 8192
buffer_size  = 8192

# RESPONSE-direction records: the endpoint's HEAD (status, content type,
# headers minus the connection's framing, first body bytes), BODY (MORE until
# the last) within the caller's response credit, CREDIT (request-body credit,
# granted as the body's bytes leave for the transport), and ABORT when an
# exchange fails after its response began.
[[ports]]
name         = "response_out"
index        = 2
direction    = "output"
content_type = "HttpResponse"
max_record   = 8192
buffer_size  = 8192

[[resources]]
requires_contract = "channel"
access            = "read"

[observability]
exempt = "S3/SigV4 connector; throughput is observed at the network provider"
