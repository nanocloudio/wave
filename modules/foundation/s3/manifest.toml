version          = "0.1.0"
hardware_targets = ["bcm2712"]
timer_class      = "wall_clock"

[[ports]]
name         = "net_in"
direction    = "input"
content_type = "NetProto"
buffer_size  = 2048

[[ports]]
name         = "net_out"
direction    = "output"
content_type = "NetProto"
buffer_size  = 2048
max_record   = 1600

[[ports]]
name         = "status_out"
index        = 1
direction    = "output"
content_type = "TextPlain"
buffer_size  = 2048

# Driven mode: the connector is a PROVIDER of the exchange contract
# (`abi::contracts::exchange`), performing one exchange at a time. A requester
# writes REQUEST-direction records here: HEAD (method, `/bucket/key[?query]`,
# extra header lines, response credit, and the body inline when it fits), BODY
# (MORE until the last) under the credit the connector grants, CREDIT (more
# response credit) and ABORT. A body that does not ride whole in the HEAD needs
# a `content-length` header (400 without one).
#
# Both ports unwired = the boot ListBuckets probe.
[[ports]]
name         = "request_in"
index        = 1
direction    = "input"
content_type = "ExchangeRequest"
max_record   = 8192
buffer_size  = 8192

# RESPONSE-direction records: the endpoint's HEAD (status, content type,
# headers minus the connection's framing, first body bytes), BODY (MORE until
# the last) within the caller's response credit, CREDIT (request-body credit,
# granted as the body's bytes leave for the transport), and ABORT when an
# exchange fails after its response began.
[[ports]]
name         = "response_out"
index        = 2
direction    = "output"
content_type = "ExchangeResponse"
max_record   = 8192
buffer_size  = 8192

[[resources]]
requires_contract = "channel"
access            = "read"

[observability]
exempt = "S3/SigV4 connector; throughput is observed at the network provider"
