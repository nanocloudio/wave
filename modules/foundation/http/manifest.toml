version = "2.0.1"
# rp2040 is in `[ci].targets`, so every variant below is built for it on each
# run and carries a flash ceiling in `tools/ci/fmod_size_budget.sh`. A variant
# that cannot fit is meant to fail admission there rather than drop out of the
# matrix unremarked, which is the failure a per-target opt-out invites.
hardware_targets = ["rp2040", "rp2350", "bcm2712"]

# timer_class: every deadline this module holds is read from wall-clock
# `dev_millis` — the client connect timeout (client.rs / client_h2.rs
# CONNECT_TIMEOUT_MS) and the proxy dial/retry deadline (server.rs). Nothing
# counts scheduler passes as time, so a variable cadence changes only WHEN a
# deadline is sampled, never whether it is correct. Positively attested rather
# than left absent: an unattested module is assumed step-counted and is refused
# admission to a variable-cadence domain, which is a placement restriction this
# module does not need.
timer_class = "wall_clock"

# Ingress anchor role:
# in proxy mode on a leased TCP port the http fmod is the client-visible
# stream transport attachment. Declared so the `continuity` config
# validator (class edge_anchored) accepts an http-fronted edge; the
# tls-fronted 443 edge additionally requires `transport.anchor.stream.secure`
# on the tls module in front. `.secure` is an orthogonal child, so the
# cleartext http anchor declares the base `transport.anchor.stream`.
#
# The source declares the union; selected variants remove capabilities and
# ports they do not implement. Graph admission and embedded port metadata
# both use that specialization, preserving numeric indices across omissions.
capabilities = ["transport.anchor.stream", "stream.ordered_ack.exchange"]

# Feature-set variants. `full` (default) emits the
# unsuffixed http.fmod with every protocol generation; `http-web.fmod` drops
# HTTP/2 + HTTP/3 (h2/hpack/wire_h2/client_h2 + h3/qpack/wire_h3) for embedded
# targets that serve single-connection HTTP/1 (+WebSocket). Measured saving:
# 105 794 -> 66 146 B on rp2350 (-37%), 243 690 -> 175 546 B on bcm2712 (-28%).
# Sizes are gated by tools/ci/fmod_size_budget.sh so they cannot drift silently.
#
# `h1` and `ws` are declared markers — always compiled. A `min` (h1-only)
# variant needs the ws seams gated first — ws scatter is roughly ten times
# h2's, 181 references in the server core alone — and the prize looks
# small: the ws-attributable NAMED symbols in http-web.elf total ~1.2 KiB of its
# 66 KiB, the rest being inlined into the shared request path. Worth doing only
# against a specific flash target that the `web` variant misses.
# `session` is the SessionCtrlV1 anchor (`server/session.rs`): the control
# plane that lets a fan-out WebSocket's worker be swapped with the client's
# connection open. Carried by the server-class shapes (`full`, `h2`,
# `exchange`) and omitted from the embedded ones, where a transport anchor is
# not the role a constrained device plays (protocol_surfaces.md §Target-Class
# Fit) and its flash is. The ports it answers on are omitted with it.
[[variant]]
name = "web"
features = ["h1", "ws"]
omit_ports = ["req_out", "resp_in", "publish_in", "reply_out", "ctrl_in", "ctrl_out", "ctrl2_in", "ctrl2_out", "ws2_out", "ws2_in", "sessions_changes", "sessions_sink"]
omit_capabilities = ["stream.ordered_ack.exchange"]

# h1 + the HANDLER_APP request/response fan-out, nothing else — the ingress
# for graphs whose application IS downstream modules (chronicle's reverser
# serves its whole pipeline chain through this on a Pi 5 whose netboot image
# ceiling the full variant would cross).
[[variant]]
name = "app"
features = ["h1", "app"]
omit_ports = ["publish_in", "reply_out", "ctrl_in", "ctrl_out", "ctrl2_in", "ctrl2_out", "ws2_out", "ws2_in", "sessions_changes", "sessions_sink"]
omit_capabilities = ["stream.ordered_ack.exchange"]

# h1 + h2 + ws — everything but HTTP/3.
#
# The saving is real because `h3.rs` is reachable from `module_step` through the
# mux pump: it is live code in `full`, so leaving it out is bytes off the
# artefact rather than bytes `--gc-sections` would have dropped anyway. An
# unreachable layer would make this variant byte-identical to `full` and not
# worth carrying. The measured delta is in the module README, and
# `tools/ci/fmod_size_budget.sh` holds both sizes.
[[variant]]
name = "h2"
features = ["h1", "h2", "ws", "app", "session"]
omit_ports = ["publish_in", "reply_out"]
omit_capabilities = ["stream.ordered_ack.exchange"]


# Every protocol generation plus the graph-driven client exchange: requests
# arrive on `publish_in` at run time instead of being fixed by params, and
# responses leave on `reply_out` as an ordered-ack exchange.
#
# Feature-gated because the accumulator, the key buffer and the staging frame
# are ~26 KiB of state, and the wider path and request bodies that come with
# them are real cost an embedded one-shot client should not carry.
[[variant]]
name = "h1_exchange"
features = ["h1", "exchange"]
omit_ports = ["req_out", "resp_in", "ctrl_in", "ctrl_out", "ctrl2_in", "ctrl2_out", "ws2_out", "ws2_in", "sessions_changes", "sessions_sink"]

[[variant]]
name = "exchange"
features = ["h1", "h2", "h3", "ws", "app", "exchange", "session"]

[[variant]]
name = "full"
features = ["h1", "h2", "ws", "h3", "app", "session"]
omit_ports = ["publish_in", "reply_out"]
omit_capabilities = ["stream.ordered_ack.exchange"]
default = true

[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"
# Sized to absorb 8 KiB CMD_SEND payloads (the staging cap on aarch64)
# plus in-flight headroom; embedded workloads stage 1600-byte payloads
# on a 2 KiB budget.
buffer_size = { default = 2048, bcm2712 = 16384 }

[[ports]]
name = "variables"
index = 1
direction = "input"
content_type = "FmpMessage"
buffer_size = 256

[[ports]]
name = "file_data"
index = 2
direction = "input"
content_type = "OctetStream"
buffer_size = { default = 2048, bcm2712 = 16384 }

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"
buffer_size = { default = 2048, bcm2712 = 16384 }

[[ports]]
name = "file_ctrl"
index = 1
direction = "output"
content_type = "OctetStream"
buffer_size = 256

# WebSocket fan-out — populated only when a route uses
# HANDLER_WEBSOCKET_FANOUT (handler value 5). On such routes the upgraded
# connection's frames are routed externally as WsFrame records on these
# ports instead of being echoed internally. Routes that use the existing
# HANDLER_WEBSOCKET (4) ignore these channels and keep echoing.
[[ports]]
name = "ws_out"
index = 2
direction = "output"
content_type = "WsFrame"

[[ports]]
name = "ws_in"
index = 3
direction = "input"
content_type = "WsFrame"
# WsFrame envelopes from ws_stream: [conn_id u32][opcode][fin][len u16]
# [payload]. Channel writes are all-or-nothing, so a ring too small for an
# envelope silently rejects every one of them — hence the generous depth.
#
# `max_record` is the honest per-envelope ceiling, and it is NOT the ring size.
# The reader takes one envelope per `channel_read` into a scratch of
# `abi::CHANNEL_BUFFER_SIZE`, and there is no syscall by which a module can
# learn a port's declared record size and size that scratch from it. A larger
# `max_record` would therefore be a promise the reader cannot keep: the envelope
# is consumed, found short, and dropped (counted as `ws_envelopes_dropped`).
# Declaring the true ceiling makes the config validator reject the mistake
# instead of the runtime discarding data. The ring stays deep so several
# envelopes pipeline.
buffer_size = { default = 65600, bcm2712 = 131072 }
max_record  = 8192

# Compiled-route subscription sink. The graph self-wires
# `routes_sink` (out[4]) -> `routes_changes` (in[4]) so the store's
# namespace.change SUBSCRIBE for the `/dataplane/edge/` prefix has a
# module-owned sink.
[[ports]]
name = "routes_changes"
index = 4
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

[[ports]]
name = "routes_sink"
index = 4
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

# Dynamic-listener subscription self-edge.
# A SECOND table_consumer: the graph self-wires `listeners_sink` (out[5])
# -> `listeners_changes` (in[5]) so the store's namespace.change SUBSCRIBE
# for `listeners_prefix` (e.g. /dataplane/edge-listeners/) has a
# module-owned sink. Each added `<port> = proto=tcp;tls=<0|1>` row drives a
# mid-life CMD_BIND of the pooled port; a removed row tears the listener
# down. Both ports are inert unless `listeners_prefix` is configured.
[[ports]]
name = "listeners_changes"
index = 5
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

[[ports]]
name = "listeners_sink"
index = 5
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

# HTTP application fan-out — populated only when a route uses HANDLER_APP
# (handler value 11). The symmetric counterpart to ws_out/ws_in: there, this
# module owns the WebSocket envelope and a downstream module owns the
# application protocol inside it; here it owns HTTP framing, connection state
# and bounded body handling, and a downstream module owns what the request
# MEANS. `docs/specification.md` already put "HTTP application resources,
# authorization, webhook meaning, business handlers" outside Wave — these two
# ports are how something else holds them.
#
# Requests carry `[conn_id u16][stream_id u16][method u8][flags u8]
# [path_len u16][hdr_len u16][body_len u16]` then the path, the raw header
# block and the decoded body. `stream_id` rides beside `conn_id` because HTTP/2
# multiplexes many requests over one connection; correlating on conn_id alone
# misroutes as soon as a client opens parallel streams. Under HTTP/1.1 it is a
# request generation rather than a stream index, because connection ids are
# recycled and a late answer would otherwise match the next holder of the id.
# An application MUST echo `stream_id` back on the response either way.
[[ports]]
name = "req_out"
index = 6
direction = "output"
content_type = "HttpRequest"
max_record = 8192
# One request envelope: the head plus the decoded body. `max_record` is the
# ceiling on ONE envelope and is set to what the reader can actually take (see
# `ws_in` above); `buffer_size` is ring depth, so a larger ring pipelines more
# envelopes rather than bigger ones.
#
# This bounds the request body that can be FORWARDED, which is not the same as
# the body the server will accept: `max_body_kib` governs that, and a request
# larger than the envelope is refused with a 503 naming this mismatch rather
# than being truncated. A graph ingesting artefacts raises neither — it uses the
# streaming path, which is what `MORE_BODY` exists for.
buffer_size = { default = 8192, bcm2712 = 65536 }

[[ports]]
name = "resp_in"
index = 6
direction = "input"
content_type = "HttpResponse"
# Same ceiling as `req_out`, for the same reason. A response larger than this
# is not a bigger envelope — it is a STREAM: the application sets `MORE_BODY`
# and sends it across several envelopes, which is the only way a response can
# exceed the send buffer anyway. An application that writes one oversize
# envelope has it dropped and counted as `app_envelopes_oversize`.
max_record = 8192
buffer_size = { default = 8192, bcm2712 = 65536 }

[[resources]]
requires_contract = "channel"
access = "read"

# Read-only grant on the compiled route prefix. A table consumer holds
# a storage.namespace READ grant and nothing else: it SUBSCRIBEs +
# CHANGES the `/dataplane/edge/` prefix and never writes the store —
# degradation goes to telemetry (http.routes.dropped), not a store key.
[[resources]]
requires_contract = "storage.namespace"
access = "read"

# HANDLER_FS_FILE routes serve files by path through the FS_CONTRACT
# (`fat32` on bare-metal, `linux_fs_dispatch` on the host). Granting
# `fs` enables `provider_call(-1, FS_OPEN, ...)`.
[[resources]]
requires_contract = "fs"
access = "read"

[observability]
# id 2 = routes_dropped (http.routes.dropped): dynamic-route arena /
# backend-set overflow.
# id 3 = proxy_retries (http.proxy.retries), id 4 = proxy_5xx
# (http.proxy.5xx): proxy-relay failover / terminal 5xx.
#
# ids 5-13 are the load-shedding surface. Every one of these paths refuses or
# drops work under pressure, and uncounted each would present to an operator
# as the same symptom — a slow or reset client — while having a different fix.
# They are positional and append-only, so ids 0-4 keep their meanings.
#
# id  5 = backpressure_steps (http.backpressure.steps): counted at every send
#         seam. The idle heuristic reads the same count, so a module shedding
#         work reads as busy to the scheduler and as shedding to the operator.
# id  6 = conns_refused_slots, id 7 = conns_refused_arena: an accept refused
#         because the slot table was full, versus because the arena could not
#         supply the slot's buffers. Different constants, different fix; as one
#         number the answer is unactionable.
# id  8 = demux_stalls (http.demux.stalls): the inbound demux stopped early
#         because one slot's recv_buf was full, delaying every other
#         connection. Head-of-line blocking, invisible in throughput until
#         severe.
# id  9 = app_timeouts, id 10 = app_envelopes_lost, id 11 =
#         app_envelopes_oversize: the application fan-out's shed paths.
#         `lost` is never expected in a healthy graph — it means a response was
#         dropped rather than delayed, so the application believes it answered
#         a client that never was.
# id 12 = ws_envelopes_dropped, id 13 = h2_streams_refused.
# id 16 = ws_events_dropped: a WebSocket lifecycle event lost because the retry
#         ring was already full. Non-zero means an application's view of which
#         connections exist has diverged from this module's — it is tracking a
#         connection that has closed, or receiving frames from one it was never
#         told opened.
# id 14 = h3_handler_unavailable, id 15 = h3_field_limit_refused: HTTP/3's two
#         refusal paths, both CONFIGURATION signals rather than load ones.
#         `handler_unavailable` means a route serving fine over h1/h2 is
#         reachable over h3 and cannot be served there; `field_limit_refused`
#         means a peer advertised a header-size limit tighter than our smallest
#         response, so nothing can be sent to it at all. Each otherwise presents
#         as a client that gets no useful answer with no error naming why.
# id 17 = peers_unbound: a peer-identity record arrived and bound nothing —
#         the handshake failed, the chain did not validate, or the peer proved
#         no key. On a listener configured for mutual TLS this is the signal
#         that callers are reaching the application anonymous, which nothing at
#         request level shows: the request succeeds and the application simply
#         never learns who made it.
metrics = [
  "bytes_in",
  "bytes_out",
  "routes_dropped",
  "proxy_retries",
  "proxy_5xx",
  "backpressure_steps",
  "conns_refused_slots",
  "conns_refused_arena",
  "demux_stalls",
  "app_timeouts",
  "app_envelopes_lost",
  "app_envelopes_oversize",
  "ws_envelopes_dropped",
  "h2_streams_refused",
  "h3_handler_unavailable",
  "h3_field_limit_refused",
  "ws_events_dropped",
  "peers_unbound",
  # ids 18/19 are the per-request pair. Every other counter here measures
  # bytes, shedding or refusal, none of which yields a request rate or a
  # latency distribution; the span carries per-request detail but is
  # head-sampled, so it answers "which request was slow" and not "how many,
  # how slow".
  #
  # Both describe HTTP/1, whose responses drain through a single chokepoint;
  # h2 and h3 complete on their own paths and are not counted here. Neither
  # moves with the span sampling rate. `request_latency_us` is a 16-bucket
  # histogram whose bounds are declared below and shipped to consumers through
  # the id-table — bounds are metadata, and the record carries counts alone.
  "requests_total",
  "request_latency_us",
  # ids 20-23 are the connection-lifetime surface. Nothing else on the path
  # closes an established connection that stops talking, so without these a
  # silent peer holds a slot, its buffers and a TLS session indefinitely, and
  # enough of them make a listener deaf with every counter above reading zero.
  #   20 = conns_timeout_header: no complete request head within
  #        `header_timeout_ms` of the wait for it beginning (a slow or hostile
  #        client, a header trickled a byte at a time included).
  #   21 = conns_timeout_idle: a keepalive, h2 or h3 connection with no
  #        admitted work for `keepalive_idle_ms` (`pressure_idle_ms` once the
  #        table is three quarters full), or a WebSocket past `ws_idle_ms`.
  #   22 = conns_timeout_stall: bytes stopped moving mid-request for
  #        `stall_ms` — a body that stopped arriving or a peer that stopped
  #        reading.
  #   23 = conns_evicted_idle: an accept found no free slot and took the
  #        longest-idle keepalive connection's. Rising steadily means the
  #        slot table is sized below the working set.
  "conns_timeout_header",
  "conns_timeout_idle",
  "conns_timeout_stall",
  "conns_evicted_idle",
  # ids 24-28 are the session anchor (`server/session.rs`). All zero on an
  # instance whose anchor ports are unwired.
  #   24 = sessions_attached: fan-out connections a worker accepted.
  #   25 = sessions_moved: sessions that changed worker with the client's
  #        connection open — the number continuity delivered.
  #   26 = swaps_completed: worker swaps that ran to the end.
  #   27 = swaps_refused: sessions a swap left on the old worker (cursors
  #        disagreed, the import failed, or the window closed).
  #   28 = ws_envelopes_misowned: envelopes from a worker that does not own
  #        the session they name, dropped. Non-zero means a worker wrote
  #        after it was detached, which is a worker fault, not a load one.
  "sessions_attached",
  "sessions_moved",
  "swaps_completed",
  "swaps_refused",
  "ws_envelopes_misowned",
]
# Span 0: one `http.server.request` span per request (head parsed -> response
# drained), SERVER kind. Minted only when a telemetry consumer is subscribed
# (zero-cost otherwise). Keepalive re-latches the span per request.
spans = ["http.server.request"]


# Per-instrument metadata (id-table rows). `bounds_us` MUST match
# `server::body::LAT_BOUNDS_US`: the module classifies against its compiled
# ladder while consumers label buckets from this declaration, so any drift
# between them mislabels every bucket. `manifest_contract.rs` holds the two
# identical.
#
# 250 µs to 10 s spans what this server actually sees — a healthy request
# lands mid-ladder, and a stalled backend still resolves near the top rather
# than piling into one saturated bucket.
[[observability.instrument]]
name      = "requests_total"
kind      = "counter"

[[observability.instrument]]
name      = "request_latency_us"
kind      = "histogram16"
bounds_us = [250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000,
             250000, 500000, 1000000, 2500000, 5000000, 10000000]
# WebSocket admission (in[7] / out[7]) and lifecycle (out[8]).
#
# A route using `HANDLER_WEBSOCKET_ADMIT` reports its upgrade on
# `ws_admit_out` and waits for a decision on `ws_admit_in` before composing the
# 101. Nothing downstream ever sees a frame from a connection the application
# did not admit, and a refusal reaches the browser as an HTTP status rather
# than a socket that opens and goes quiet.
[[ports]]
name = "ws_admit_out"
index = 7
direction = "output"
content_type = "OctetStream"
buffer_size = 8192

[[ports]]
name = "ws_admit_in"
index = 7
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# Committed lifecycle facts: `opened` once an upgrade is on the wire, `closed`
# once the connection has actually ended, with the origin and close code. A
# close REQUESTED is not reported here; only what happened is.
[[ports]]
name = "ws_event_out"
index = 8
direction = "output"
content_type = "OctetStream"
buffer_size = 8192

# ── Exchange ports (client mode, `exchange` variant) ──────────────────
#
# The provider half of `stream.ordered_ack.exchange` — the role that
# ANSWERS, which the capability name states rather than a fact. A request
# arrives as a `Publish` whose payload is
# `[method:u8][path_len:u16][body_len:u16][path…][body…]`; the response leaves
# as a `Reply` carrying the body and echoing the request's `msg_key`, so a
# downstream stage rejoins without holding state.
#
# Both are optional: a graph using the one-shot param client wires neither and
# nothing changes for it.
#
# `max_record` is the contract's `PUBLISH_FRAME_MAX` / `REPLY_FRAME_MAX`
# (13 overhead + 512 key + 8192 payload = 8717) PLUS the 3-byte channel
# envelope the frames ride, because a record is what one `channel_write` puts
# on the ring and this module writes envelope and frame together. Declaring
# the frame alone would under-declare every full-size record by 3 bytes — the
# rejection nobody sees until the largest payload in production. The ring
# holds two, so a producer can write the next while one is being performed.
#
# in[8] and out[9], not in[7]/out[7]: WebSocket admission already holds index 7
# in BOTH directions, and the `exchange` variant compiles `ws` too. Sharing an
# index would have this client read admission decisions as publish frames and
# write replies onto the admission request port. Indices are per-direction, so
# the two numbers differ — appended is what matters, not matched.
[[ports]]
name = "publish_in"
index = 8
direction = "input"
content_type = "OctetStream"
buffer_size = 17440
max_record = 8720

[[ports]]
name = "reply_out"
index = 9
direction = "output"
content_type = "OctetStream"
buffer_size = 17440
max_record = 8720

# Facts are declared under the parent surface `stream.ordered_ack`: both roles
# carry the same terms, and the capability NAME is what says which role this
# is. That answers-with-data is not a fact here — `.exchange` already says it,
# and the registry admits no `reply` fact to say it twice.
[capability_facts."stream.ordered_ack.exchange"]
# A 2xx means the origin accepted the request, not that anything was made
# durable — HTTP has no durability contract to offer.
ack         = "transport"
# One connection per exchange and one request in flight, so ordering is
# trivially preserved: there is never a second record to reorder against.
ordering    = "single"
# `FLAG_BROADCAST` is refused rather than ignored. This client dials one
# origin, and acking a fan-out that reached one destination would report a
# delivery that did not happen.
broadcast   = "unsupported"
max_payload = 8192

# Per-session peer identity from the `tls` module, carrying what a handshake
# established about the peer. It is what lets an application behind this module
# authorise on WHO is calling: the identity is proved at the TLS boundary and
# has no other way across it.
#
# OPTIONAL. Unwired, every request is anonymous and the request envelope
# carries no identity trailer — the plaintext deployment, unchanged.
[[ports]]
name = "peer_identity"
# Input index 9. Explicit, like every port past the first: these are ABI
# positions the module resolves by number, not by declaration order.
index = 9
direction = "input"
content_type = "OctetStream"
buffer_size = 4096
# The largest record the contract's layout admits: frame header, fixed fields,
# a 32-byte fingerprint and a 128-byte principal. A port that cannot take one
# whole is not a short read — the length check fails, no identity binds, every
# authenticated client is silently anonymous, and the undelivered bytes desync
# whatever follows.
max_record = 195

# ── Session anchor (SessionCtrlV1 to the fan-out workers) ──────────────
#
# The control plane that makes a fan-out WebSocket a Fluxor session
# (`server/session.rs`, `docs/architecture/session_continuity.md`). Worker 0's
# data plane IS `ws_out` / `ws_in`; its control pair is `ctrl_out` /
# `ctrl_in`. A standby worker gets its own control AND data pairs
# (`ctrl2_*`, `ws2_*`), following the `ctrl2` / `data2` shape of fluxor's
# `echo_anchor`, because channels are static and the anchor's forwarding
# flip is the activation. Every port here is inert until wired: an
# instance with `ctrl_out` unwired anchors nothing and serves a plain
# fan-out. The `web`, `app` and `h1_exchange` variants omit the `session`
# feature and these ports with it.
#
# Control frames are SessionCtrlV1 TLVs; an export chunk is the largest.
# `max_record` is the anchor's `CTRL_FRAME_MAX` plus the 3-byte header.
[[ports]]
name = "ctrl_in"
index = 10
direction = "input"
content_type = "OctetStream"
buffer_size = 32768
max_record = 1027

[[ports]]
name = "ctrl_out"
index = 3
direction = "output"
content_type = "OctetStream"
buffer_size = 32768
max_record = 1027

[[ports]]
name = "ctrl2_in"
index = 11
direction = "input"
content_type = "OctetStream"
buffer_size = 32768
max_record = 1027

[[ports]]
name = "ctrl2_out"
index = 10
direction = "output"
content_type = "OctetStream"
buffer_size = 32768
max_record = 1027

# The standby's data plane: the same `WsFrame` envelopes as `ws_out` /
# `ws_in`, with the same mailbox requirement and the same per-envelope
# ceiling (see `ws_in` above for why `max_record` is what it is).
[[ports]]
name = "ws2_out"
index = 11
direction = "output"
content_type = "WsFrame"

[[ports]]
name = "ws2_in"
index = 12
direction = "input"
content_type = "WsFrame"
buffer_size = { default = 65600, bcm2712 = 131072 }
max_record  = 8192

# Swap-trigger subscription self-edge. The graph self-wires `sessions_sink`
# (out[12]) -> `sessions_changes` (in[13]) so the store's namespace.change
# SUBSCRIBE for `sessions_prefix` has a module-owned sink; the row
# `<prefix>active = <0|1>` names the worker new sessions attach to, and a
# change away from the current one requests a swap. The operator's trigger,
# following the `listeners_changes` precedent; `handoff_after_frames` is the
# gates'. Both inert unless `sessions_prefix` is configured.
[[ports]]
name = "sessions_changes"
index = 13
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

[[ports]]
name = "sessions_sink"
index = 12
direction = "output"
content_type = "OctetStream"
buffer_size = 4096
